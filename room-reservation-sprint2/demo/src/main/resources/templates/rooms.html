<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Client Sign Up</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="page">
    <div class="form-card">

        <h1>Client Sign Up</h1>
        <p>Create your account to book rooms.</p>

        <!-- Signup Form -->
        <form th:action="@{/signup}" th:object="${user}" method="post">

            <input type="text"
                   th:field="*{name}"
                   placeholder="Full name"
                   required>

            <input type="email"
                   th:field="*{email}"
                   placeholder="Email"
                   required>

            <input type="password"
                   th:field="*{password}"
                   placeholder="Password"
                   required>

            <button type="submit" class="btn green">
                Create Account
            </button>
        </form>

        <!-- Back Button -->
        <a href="/" class="link">Back Home</a>

    </div>
</div>

</body>
</html>
